name: 自动更新版本信息

on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: 获取 Release 信息
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最新 Release
          RELEASE_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          RELEASE_JSON=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" $RELEASE_URL)
          
          # 提取版本号
          TAG_NAME=$(echo "$RELEASE_JSON" | grep -o '"tag_name":"[^"]*"' | cut -d'"' -f4)
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=$TAG_NAME" >> $GITHUB_ENV
          
          # 提取更新日志
          NOTES=$(echo "$RELEASE_JSON" | grep -o '"body":"[^"]*"' | cut -d'"' -f4 | sed 's/\\n/\
/g')
          echo "NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # 提取发布日期
          DATE=$(echo "$RELEASE_JSON" | grep -o '"published_at":"[^"]*"' | cut -d'"' -f4 | cut -d'T' -f1)
          echo "DATE=$DATE" >> $GITHUB_ENV
          
          # 查找 DMG 下载链接
          DMG_URL=$(echo "$RELEASE_JSON" | grep -o '"browser_download_url":"[^"]*\.dmg"' | head -1 | cut -d'"' -f4)
          echo "DMG_URL=$DMG_URL" >> $GITHUB_ENV
          
          # 获取文件大小
          DMG_SIZE=$(echo "$RELEASE_JSON" | grep -o '"size":[0-9]*' | head -1 | cut -d':' -f2)
          echo "DMG_SIZE=$DMG_SIZE" >> $GITHUB_ENV
          
          echo "版本: $VERSION"
          echo "标签: $TAG_NAME"
          echo "下载地址: $DMG_URL"
          echo "文件大小: $DMG_SIZE"
      
      - name: 下载并计算校验和
        id: checksum
        run: |
          if [ -z "$DMG_URL" ]; then
            echo "错误: 没有找到 DMG 文件"
            exit 1
          fi
          
          echo "正在下载: $DMG_URL"
          curl -L -o app.dmg "$DMG_URL"
          
          if [ ! -f app.dmg ]; then
            echo "错误: DMG 下载失败"
            exit 1
          fi
          
          CHECKSUM=$(shasum -a 256 app.dmg | awk '{print $1}')
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          
          echo "校验和: $CHECKSUM"
          echo "文件大小: $(ls -la app.dmg | awk '{print $5}')"
          
          rm app.dmg
      
      - name: 更新 version.json
        run: |
          BUILD=$(date +'%Y%m%d')
          
          # 使用 Python 更新 JSON
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          
          version_file = 'version.json'
          
          with open(version_file, 'r') as f:
              data = json.load(f)
          
          data['version'] = os.environ.get('VERSION', '1.0.0')
          data['build'] = os.environ.get('BUILD', '20260727')
          data['downloadURL'] = os.environ.get('DMG_URL', '')
          data['checksum'] = os.environ.get('CHECKSUM', '')
          data['checksumAlgorithm'] = 'sha256'
          data['releaseNotes'] = os.environ.get('NOTES', 'SuvikeDrive 更新')
          data['size'] = int(os.environ.get('DMG_SIZE', '0'))
          data['minOSVersion'] = '10.15'
          data['isMandatory'] = false
          data['releaseDate'] = os.environ.get('DATE', '2026-07-27')
          
          with open(version_file, 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          
          print(f"✅ version.json 已更新到 {data['version']}")
          PYTHON_SCRIPT
          
          echo "更新后的 version.json:"
          cat version.json
      
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          
          if git diff --quiet version.json; then
            echo "没有需要提交的更改"
          else
            git add version.json
            git commit -m "🤖 自动更新版本信息到 v$VERSION"
            git push
            echo "✅ 已成功推送更新"
          fi
