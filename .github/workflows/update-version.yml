name: 自动更新版本信息

on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 安装 jq
        run: sudo apt-get update && sudo apt-get install -y jq curl
      
      - name: 获取 Release 信息
        id: release
        run: |
          # 获取最新 Release 数据
          RELEASE_DATA=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/latest)
          
          echo "Release 数据: $RELEASE_DATA"
          
          # 提取版本号
          VERSION=$(echo "$RELEASE_DATA" | jq -r '.tag_name' | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # 提取更新日志
          NOTES=$(echo "$RELEASE_DATA" | jq -r '.body' || echo "SuvikeDrive 更新")
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # 提取发布日期
          DATE=$(echo "$RELEASE_DATA" | jq -r '.published_at' | cut -d'T' -f1 || date +%Y-%m-%d)
          echo "DATE=$DATE" >> $GITHUB_OUTPUT
          
          # 提取资产信息 - 查找第一个 .dmg 文件
          ASSET_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".dmg")) | .browser_download_url' | head -1)
          ASSET_SIZE=$(echo "$RELEASE_DATA" | jq -r '.assets[] | select(.name | endswith(".dmg")) | .size' | head -1)
          
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "错误：没有找到 .dmg 资产文件"
            echo "可用的资产列表："
            echo "$RELEASE_DATA" | jq '.assets[] | {name, browser_download_url}'
            exit 1
          fi
          
          echo "DOWNLOAD_URL=$ASSET_URL" >> $GITHUB_OUTPUT
          echo "SIZE=$ASSET_SIZE" >> $GITHUB_OUTPUT
          
          echo "版本: $VERSION"
          echo "下载地址: $ASSET_URL"
          echo "文件大小: $ASSET_SIZE"
      
      - name: 下载并计算校验和
        id: checksum
        run: |
          DOWNLOAD_URL="${{ steps.release.outputs.DOWNLOAD_URL }}"
          echo "下载 URL: $DOWNLOAD_URL"
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "错误：下载 URL 为空"
            exit 1
          fi
          
          curl -L -o app.dmg "$DOWNLOAD_URL"
          
          if [ ! -f app.dmg ]; then
            echo "错误：DMG 文件下载失败"
            exit 1
          fi
          
          CHECKSUM=$(shasum -a 256 app.dmg | awk '{ print $1 }')
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "校验和: $CHECKSUM"
          
          # 显示文件信息
          ls -la app.dmg
          rm app.dmg
      
      - name: 更新 version.json
        run: |
          BUILD=$(date +'%Y%m%d')
          echo "当前 version.json:"
          cat version.json
          
          jq --arg version "${{ steps.release.outputs.VERSION }}" \
             --arg build "$BUILD" \
             --arg url "${{ steps.release.outputs.DOWNLOAD_URL }}" \
             --arg checksum "${{ steps.checksum.outputs.CHECKSUM }}" \
             --arg notes "${{ steps.release.outputs.NOTES }}" \
             --arg size "${{ steps.release.outputs.SIZE }}" \
             --arg date "${{ steps.release.outputs.DATE }}" \
             '.version = $version | 
              .build = $build | 
              .downloadURL = $url | 
              .checksum = $checksum | 
              .releaseNotes = $notes | 
              .size = ($size | tonumber) | 
              .releaseDate = $date' \
             version.json > version.json.tmp
          
          mv version.json.tmp version.json
          echo "更新后的 version.json:"
          cat version.json
      
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          
          if git diff --quiet version.json; then
            echo "没有需要提交的更改"
          else
            git add version.json
            git commit -m "🤖 自动更新版本信息到 v${{ steps.release.outputs.VERSION }}"
            git push
            echo "✅ 已成功推送更新"
          fi
