name: 自动更新版本信息

on:
  release:
    types: [published]

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 安装 GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt update && sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y
      
      - name: 获取 Release 信息
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取最新 Release 的详细信息
          RELEASE_JSON=$(gh release view --json tagName,name,body,assets,publishedAt 2>/dev/null)
          
          if [ -z "$RELEASE_JSON" ]; then
            echo "错误: 无法获取 Release 信息"
            exit 1
          fi
          
          echo "$RELEASE_JSON"
          
          # 提取版本号
          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tagName' | sed 's/^v//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # 提取更新日志
          NOTES=$(echo "$RELEASE_JSON" | jq -r '.body // "SuvikeDrive 更新"')
          echo "NOTES<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # 提取发布日期
          DATE=$(echo "$RELEASE_JSON" | jq -r '.publishedAt' | cut -d'T' -f1)
          echo "DATE=$DATE" >> $GITHUB_ENV
          
          # 查找 .dmg 文件
          DMG_INFO=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".dmg")) | {url: .url, size: .size, name: .name}')
          
          if [ -z "$DMG_INFO" ] || [ "$DMG_INFO" = "null" ]; then
            echo "错误: 没有找到 .dmg 资产文件"
            echo "可用资产:"
            echo "$RELEASE_JSON" | jq '.assets[] | .name'
            exit 1
          fi
          
          DMG_URL=$(echo "$DMG_INFO" | jq -r '.url')
          DMG_SIZE=$(echo "$DMG_INFO" | jq -r '.size')
          DMG_NAME=$(echo "$DMG_INFO" | jq -r '.name')
          
          echo "DMG_URL=$DMG_URL" >> $GITHUB_ENV
          echo "DMG_SIZE=$DMG_SIZE" >> $GITHUB_ENV
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          
          echo "版本: $VERSION"
          echo "DMG 文件: $DMG_NAME"
          echo "下载地址: $DMG_URL"
          echo "文件大小: $DMG_SIZE"
      
      - name: 下载并计算校验和
        id: checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$DMG_URL" ] || [ "$DMG_URL" = "null" ]; then
            echo "错误: DMG 下载地址为空"
            exit 1
          fi
          
          echo "正在下载: $DMG_URL"
          
          # 使用 GitHub CLI 下载
          gh release download "${{ env.VERSION }}" --pattern "*.dmg" --output app.dmg
          
          # 如果上面失败，尝试直接 curl
          if [ ! -f app.dmg ]; then
            echo "尝试使用 curl 下载..."
            curl -L -o app.dmg -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "$DMG_URL"
          fi
          
          if [ ! -f app.dmg ]; then
            echo "错误: DMG 下载失败"
            exit 1
          fi
          
          CHECKSUM=$(shasum -a 256 app.dmg | awk '{print $1}')
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          
          echo "校验和: $CHECKSUM"
          echo "文件大小: $(ls -la app.dmg | awk '{print $5}')"
          
          rm app.dmg
      
      - name: 更新 version.json
        run: |
          BUILD=$(date +'%Y%m%d')
          
          echo "当前 version.json:"
          cat version.json
          
          # 使用 Python 更新 JSON
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          
          version_file = 'version.json'
          
          with open(version_file, 'r') as f:
              data = json.load(f)
          
          data['version'] = os.environ.get('VERSION', '1.0.0')
          data['build'] = os.environ.get('BUILD', '20260727')
          data['downloadURL'] = os.environ.get('DMG_URL', '')
          data['checksum'] = os.environ.get('CHECKSUM', '')
          data['checksumAlgorithm'] = 'sha256'
          data['releaseNotes'] = os.environ.get('NOTES', 'SuvikeDrive 更新')
          data['size'] = int(os.environ.get('DMG_SIZE', '0'))
          data['minOSVersion'] = '10.15'
          data['isMandatory'] = False
          data['releaseDate'] = os.environ.get('DATE', '2026-07-27')
          
          with open(version_file, 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          
          print(f"✅ version.json 已更新到 {data['version']}")
          PYTHON_SCRIPT
          
          echo ""
          echo "更新后的 version.json:"
          cat version.json
      
      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.github.com"
          
          if git diff --quiet version.json; then
            echo "没有需要提交的更改"
          else
            git add version.json
            git commit -m "🤖 自动更新版本信息到 v$VERSION"
            git push
            echo "✅ 已成功推送更新"
          fi
